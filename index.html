<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>부모님 집 낙상 점검·안전손잡이 시공 | 온리브 ONLIV</title>
  <meta name="description" content="부모님 집 낙상 점검과 안전손잡이 시공. 점검 0원, 욕실 17~49만, 집은 개별 견적. 신청은 사진 세 장. 온리브 ONLIV." />
  <meta name="theme-color" content="#f3efe8" />
  <link rel="canonical" href="https://theonliv.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --paper:#f3efe8; --ink:#1c1814; --mute:#6a6158;
      --line:#ddd6cb; --oak:#8d734c; --wood:#c2a27a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:"Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink);line-height:1.9;letter-spacing:-.012em}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(880px,calc(100% - 64px));margin-inline:auto}
    header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:22px 32px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:12px;font-family:"Noto Serif KR",serif;letter-spacing:.32em;font-size:.72rem}
    nav{display:flex;gap:28px;font-size:.72rem;letter-spacing:.16em;color:var(--mute)}
    .hero{padding:120px 0 96px}
    .eyebrow{font-size:.64rem;letter-spacing:.32em;color:var(--mute);margin-bottom:32px}
    h1{font-family:"Noto Serif KR",serif;font-size:clamp(2.1rem,5vw,3.4rem);font-weight:500;line-height:1.28;letter-spacing:-.045em;max-width:12em}
    .lede{margin-top:24px;color:var(--mute);font-size:1rem;max-width:26ch}
    .rule{width:28px;height:1px;background:var(--oak);margin:40px 0}
    .facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:0 0 44px}
    .facts div{padding:28px 0 8px}
    .facts strong{display:block;font-family:"Noto Serif KR",serif;font-size:clamp(1.4rem,3vw,1.85rem);font-weight:500;letter-spacing:-.03em}
    .facts span{display:block;margin-top:8px;font-size:.68rem;letter-spacing:.18em;color:var(--mute)}
    .actions{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
    .btn{display:inline-flex;padding:14px 26px;background:var(--ink);color:var(--paper);font-size:.78rem;letter-spacing:.14em}
    .link{font-size:.78rem;letter-spacing:.12em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:2px}
    .panel{margin:8px 0 0;height:320px;background:
      linear-gradient(180deg,#e7dfd2 0%,#d4c4a8 70%,var(--wood) 100%);
      display:flex;align-items:end;justify-content:center;padding-bottom:48px}
    .bar{width:10px;height:190px;border-radius:8px;background:linear-gradient(var(--oak) 0 22px,var(--wood) 22px 100%)}
    section{padding:96px 0;border-top:1px solid var(--line);scroll-margin-top:72px}
    h2{font-family:"Noto Serif KR",serif;font-size:1.05rem;font-weight:500;letter-spacing:.08em;margin-bottom:40px;color:var(--mute)}
    .row{display:grid;grid-template-columns:100px 1fr auto;gap:24px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
    .row b{font-family:"Noto Serif KR",serif;font-weight:500}
    .muted{color:var(--mute)}
    footer{padding:48px 0 96px;color:var(--mute);font-size:.75rem;display:grid;gap:10px;letter-spacing:.04em}
    @media (max-width:760px){
      nav{display:none}
      .wrap{width:min(880px,calc(100% - 40px))}
      .facts,.row{grid-template-columns:1fr}
      .hero{padding-top:80px}
      .panel{height:220px}
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#top">
      <svg width="16" height="22" viewBox="0 0 64 80" aria-hidden="true">
        <rect x="18" y="24" width="28" height="42" rx="14" fill="#c2a27a"/>
        <rect x="18" y="16" width="28" height="10" rx="5" fill="#8d734c"/>
        <path d="M26 50c4 5 10 5 14 0" fill="none" stroke="#1c1814" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      ONLIV
    </a>
    <nav>
      <a href="#price">기준가</a>
      <a href="#book">신청</a>
      <a href="https://theonliv.com/">공식</a>
    </nav>
  </header>
  <main class="wrap" id="top">
    <section class="hero" style="border:0;padding-bottom:0">
      <p class="eyebrow">ONLIV</p>
      <h1>낙상 점검·안전손잡이 시공</h1>
      <p class="lede">점검하고, 손잡이를 닭니다. 신청은 사진 세 장입니다.</p>
      <div class="rule"></div>
      <div class="facts">
        <div><strong>0원</strong><span>점검</span></div>
        <div><strong>17~49만</strong><span>욕실</span></div>
        <div><strong>사진 3장</strong><span>신청</span></div>
      </div>
      <div class="actions">
        <a class="btn" href="https://theonliv.com/contact/?topic=bath">신청</a>
        <a class="link" href="https://theonliv.com/app/">점검</a>
        <a class="link" href="https://theonliv.com/care-grade/">지원 안내</a>
      </div>
      <div class="panel" role="img" aria-label="놉 캡 손잡이"><span class="bar"></span></div>
    </section>
    <section id="price">
      <h2>기준가</h2>
      <div class="row"><b>욕실</b><span class="muted">실측 후 확정</span><span>17~49만</span></div>
      <div class="row"><b>집</b><span class="muted">동선에 맞게</span><span>개별 견적</span></div>
      <p class="muted" style="margin-top:28px;font-size:.8rem">부가세 별도. 상담은 지금 무료. 정식 시공 2027년 5월.</p>
    </section>
    <section id="book">
      <h2>신청</h2>
      <div class="row"><b>1</b><span class="muted">변기·샤워·현관 사진</span><span></span></div>
      <div class="row"><b>2</b><span class="muted">기준가 회신</span><span></span></div>
      <div class="row"><b>3</b><span class="muted">예약</span><span></span></div>
      <div class="actions" style="margin-top:40px">
        <a class="btn" href="https://theonliv.com/contact/?topic=bath">사진 보내기</a>
      </div>
    </section>
    <footer>
      <p>온기는 할머니·할아버지를 미끄럼과 안전사고로부터 지킨다.</p>
      <p>온리브 ONLIV · 송상훈 · theonliv.com</p>
    </footer>
  </main>
</body>
</html>
